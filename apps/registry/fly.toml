# Fly.io config for the official spk-registry deployment.
# https://fly.io/docs/reference/configuration/
#
# Deploys come from CI (.github/workflows/registry-deploy.yml), which builds the
# image from the repository root (the registry depends on libs/spk-format) and
# releases it with:
#
#   flyctl deploy --config apps/registry/fly.toml --image registry.fly.io/spk-registry:<sha>
#
# To deploy by hand from a checkout, build and push the same way (see the
# "Deploying to Fly.io" section of apps/registry/README.md). Do not run a plain
# `fly deploy` from this directory: the build context would not include
# libs/spk-format.

app = 'spk-registry'
primary_region = 'iad'

# The image defaults to BIND_ADDR=0.0.0.0:8080 and keeps its catalog and pack
# files under /data. Secrets (ADMIN_TOKEN) are set with `fly secrets set`, never here.
[env]
  BIND_ADDR = '0.0.0.0:8080'

# Catalog (SQLite) and pack files live on this volume, so they survive deploys
# and restarts. Create it once before the first deploy:
#   fly volumes create registry_data --region iad --size 1 -a spk-registry
# A volume attaches to one machine, which matches the single-instance design.
[mounts]
  source = 'registry_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 8
    hard_limit = 12

  [http_service.http_options.response.headers]
    Strict-Transport-Security = 'max-age=31536000; includeSubDomains'

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/v1/meta'
    timeout = '5s'

[[vm]]
  # 50 MiB uploads are held in memory (and copied once while validating), so
  # 256 MB is tight for the largest allowed upload.
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
