# Fly.io config for the official spk-registry deployment.
# https://fly.io/docs/reference/configuration/
#
# Deploys come from CI (.github/workflows/registry-deploy.yml), which builds the
# image from the repository root (the registry depends on libs/spk-format) and
# releases it with:
#
#   flyctl deploy --config apps/registry/fly.toml --image registry.fly.io/spk-registry:<sha>
#
# To deploy by hand from a checkout, build and push the same way (see the
# "Deploying to Fly.io" section of apps/registry/README.md). Do not run a plain
# `fly deploy` from this directory: the build context would not include
# libs/spk-format.

app = 'spk-registry'
primary_region = 'iad'

# The catalog is Postgres (Neon) and item files live in a Tigris bucket, so the
# machine keeps no local state and needs no volume.
#
# Secrets are set with `fly secrets set`, never here:
#   DATABASE_URL          Neon pooled connection string (the `-pooler` host)
#   DATABASE_MIGRATE_URL  Neon direct (non-pooled) connection string
#   ADMIN_TOKEN           at least 32 bytes
# `fly storage create` sets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and
# AWS_REGION for the Tigris bucket.
[env]
  BIND_ADDR = '0.0.0.0:8080'
  STORAGE_BACKEND = 's3'
  S3_BUCKET = 'spk-registry-x7k2q9'
  S3_ENDPOINT = 'https://fly.storage.tigris.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 8
    hard_limit = 12

  [http_service.http_options.response.headers]
    Strict-Transport-Security = 'max-age=31536000; includeSubDomains'

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/v1/meta'
    timeout = '5s'

[[vm]]
  # Matches what is deployed. An upload is held in memory (and copied once while
  # validating), so raise this if you start publishing packs near the 50 MiB limit.
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
