[package]
name = "spk-registry"
version = "0.1.0"
edition = "2021"
description = "Spiral item registry: catalog listing, version resolution, and download serving"
license = "Apache-2.0"
repository = "https://github.com/brpowell/spiral"
readme = "README.md"
default-run = "spk-registry"

[[bin]]
name = "spk-registry"
path = "src/main.rs"

[[bin]]
name = "spk-registry-seed"
path = "src/bin/seed.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
rust-embed = "8"
rust-s3 = { version = "0.38", default-features = false, features = ["tokio-rustls-tls-ring", "fail-on-err"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
constant_time_eq = "0.3"
governor = "0.10"
http-body-util = "0.1"
hex = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
spk-format = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "sqlite",
  "postgres",
  "macros",
  "migrate",
  "chrono",
] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tower = { version = "0.5", features = ["util"] }
