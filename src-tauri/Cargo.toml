[package]
name = "Spiral"
version = "0.2.2"
description = "OWN MUSIC"
authors = ["Bryan Powell"]
edition = "2021"
default-run = "Spiral"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "spiral_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Developer CLIs. Tauri bundles every Cargo bin into the app, so these are
# feature-gated and live outside src/bin/ (tauri-cli also disk-scans src/bin/
# and ignores required-features: https://github.com/tauri-apps/tauri/issues/15325).
# Never pass --features dev-bins to `tauri build`.
# `license-dev-key` embeds the development license public key in a *release*
# build so a packaged installer can accept locally issued sandbox cards.
[features]
dev-bins = []
license-dev-key = []

[[bin]]
name = "read_tags"
path = "src/dev-bin/read_tags.rs"
required-features = ["dev-bins"]

[[bin]]
name = "wms_import"
path = "src/dev-bin/wms_import.rs"
required-features = ["dev-bins"]

[[bin]]
name = "skin_convert_compare"
path = "src/dev-bin/skin_convert_compare.rs"
required-features = ["dev-bins"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
id3 = "1"
metaflac = "0.2"
mp4ameta = "0.13"
reqwest = { version = "0.12", features = ["blocking", "json"] }
dotenvy = "0.15"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = "2.1"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
color_quant = "1.1"
gif = "0.14"
zip = "2"
quick-xml = "0.41"
encoding_rs = "0.8"
spk-format = { git = "https://github.com/spiral-powered/spk-format.git", branch = "main" }
mp3-duration = "0.1.10"
alac-encoder = "0.3"
mp3lame-encoder = "0.2.4"
flacenc = "0.5.1"
fdk-aac = "0.8"
lofty = "0.22"
symphonia = { version = "0.5", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "pcm", "ogg", "vorbis"] }
opus-decoder = "0.1"
notify = { version = "6.1", features = ["macos_fsevent"] }
tiny_http = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSOpenPanel", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "block2", "NSData", "NSDictionary", "NSNotification", "NSOperation", "NSString", "NSURL"] }
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Devices_Cdrom",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Forward second-instance argv (file association opens) into the running app.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
souvlaki = "0.8"
tauri-plugin-deep-link = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"

# Bindings only — do not compile vendored LAME. Shared lib comes from native-lame.
[patch.crates-io]
mp3lame-sys = { path = "crates/mp3lame-sys" }

# On-machine sampling (samply / Instruments). `tauri build` still uses [profile.release].
# See docs/contributing/profiling.md.
[profile.profiling]
inherits = "release"
debug = true

