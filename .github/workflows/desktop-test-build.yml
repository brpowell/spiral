# Unsigned test installers for Windows and Linux, to try a change on other machines.
#
# Unlike `desktop-release.yml` this never creates or touches a tag or GitHub Release, never
# enters the `production-release` environment, and never sees a signing secret: it builds from the
# ref, uploads the installers as workflow artifacts (14 days), and stops. Windows builds are
# unsigned (SmartScreen will warn) and no updater artifacts are produced.
#
# Trigger it by adding a label to a pull request (add it again to rebuild: remove, then re-add):
#   test-build                 all four cells
#   test-build:windows         windows-x64 + windows-aarch64
#   test-build:windows-x64     one cell (likewise windows-aarch64, linux-x64, linux-aarch64)
#   test-build:linux           linux-x64 + linux-aarch64
# or run it from the Actions tab (once this file is on the default branch) and pick a platform.
#
# Keep the matrix and Linux dependencies below in sync with `desktop-release.yml`.
name: Test build

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platforms to build (a prefix of a cell label, or `all`)"
        required: false
        default: all
        type: choice
        options:
          - all
          - windows
          - windows-x64
          - windows-aarch64
          - linux
          - linux-x64
          - linux-aarch64

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name || inputs.platforms }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan build matrix
    runs-on: ubuntu-latest
    # Ignore unrelated labels.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.label.name, 'test-build') }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Select matrix cells
        id: matrix
        env:
          LABEL: ${{ github.event.label.name }}
          INPUT: ${{ inputs.platforms }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            selected="${INPUT:-all}"
          elif [ "$LABEL" = "test-build" ]; then
            selected="all"
          else
            selected="${LABEL#test-build:}"
          fi
          all='[
            {"label":"windows-x64","platform":"windows-latest","args":"--bundles nsis","rust_targets":""},
            {"label":"windows-aarch64","platform":"windows-11-arm","args":"--target aarch64-pc-windows-msvc --bundles nsis","rust_targets":"aarch64-pc-windows-msvc"},
            {"label":"linux-x64","platform":"ubuntu-24.04","args":"--bundles appimage,deb,rpm","rust_targets":""},
            {"label":"linux-aarch64","platform":"ubuntu-24.04-arm","args":"--bundles appimage,deb,rpm","rust_targets":""}
          ]'
          matrix=$(jq -c --arg p "$selected" \
            '{include: [.[] | select($p == "all" or (.label | startswith($p)))]}' <<<"$all")
          if [ "$(jq '.include | length' <<<"$matrix")" -eq 0 ]; then
            echo "::error::No matrix cells match platforms=$selected"
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq . <<<"$matrix"

  build:
    name: Build (${{ matrix.label }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.label }}

      - name: Install Linux webkit / bundler deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf \
            libfuse2t64 \
            xdg-utils
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          echo "TMPDIR=${{ github.workspace }}/target/tmp" >> "$GITHUB_ENV"
          mkdir -p "${{ github.workspace }}/target/tmp"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # The app config turns on updater artifacts, which need the release signing key. A test
      # build has no key, so switch them off for this run only. A file (not inline JSON) because
      # quoting inline JSON differs between the Windows and Linux shells.
      - name: Disable updater artifacts
        shell: bash
        run: echo '{"bundle":{"createUpdaterArtifacts":false}}' > apps/desktop/test-build.conf.json

      - name: Build installers
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }} --config test-build.conf.json

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: spiral-${{ matrix.label }}
          path: |
            target/**/bundle/nsis/*.exe
            target/**/bundle/appimage/*.AppImage
            target/**/bundle/deb/*.deb
            target/**/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14
