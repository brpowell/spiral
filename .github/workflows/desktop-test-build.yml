# Unsigned test installers for every desktop platform, to try a change on other machines.
#
# Unlike `desktop-release.yml` this never creates or touches a tag or GitHub Release, never
# enters the `production-release` environment, and never sees a signing secret: it builds from the
# selected branch, uploads the installers as workflow artifacts (14 days), and stops. Builds are
# unsigned (Windows shows SmartScreen warnings; macOS needs the quarantine flag cleared) and no
# updater artifacts are produced.
#
# Run it from the Actions tab: pick the branch under "Use workflow from" and tick the platforms to
# build. GitHub only lists a workflow there once the file is on the default branch.
#
# Keep the matrix and Linux dependencies below in sync with `desktop-release.yml`.
name: Test build

on:
  workflow_dispatch:
    inputs:
      macos:
        description: "macOS (universal)"
        type: boolean
        default: true
      windows_x64:
        description: "Windows x64"
        type: boolean
        default: true
      windows_aarch64:
        description: "Windows ARM64"
        type: boolean
        default: true
      linux_x64:
        description: "Linux x64"
        type: boolean
        default: true
      linux_aarch64:
        description: "Linux ARM64"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Select matrix cells
        id: matrix
        env:
          MACOS: ${{ inputs.macos }}
          WINDOWS_X64: ${{ inputs.windows_x64 }}
          WINDOWS_AARCH64: ${{ inputs.windows_aarch64 }}
          LINUX_X64: ${{ inputs.linux_x64 }}
          LINUX_AARCH64: ${{ inputs.linux_aarch64 }}
        run: |
          selected=()
          if [ "$MACOS" = "true" ]; then selected+=(macos-universal); fi
          if [ "$WINDOWS_X64" = "true" ]; then selected+=(windows-x64); fi
          if [ "$WINDOWS_AARCH64" = "true" ]; then selected+=(windows-aarch64); fi
          if [ "$LINUX_X64" = "true" ]; then selected+=(linux-x64); fi
          if [ "$LINUX_AARCH64" = "true" ]; then selected+=(linux-aarch64); fi
          if [ "${#selected[@]}" -eq 0 ]; then
            echo "::error::Tick at least one platform."
            exit 1
          fi
          all='[
            {"label":"macos-universal","platform":"macos-latest","args":"--target universal-apple-darwin --bundles app,dmg","rust_targets":"aarch64-apple-darwin,x86_64-apple-darwin"},
            {"label":"windows-x64","platform":"windows-latest","args":"--bundles nsis","rust_targets":""},
            {"label":"windows-aarch64","platform":"windows-11-arm","args":"--target aarch64-pc-windows-msvc --bundles nsis","rust_targets":"aarch64-pc-windows-msvc"},
            {"label":"linux-x64","platform":"ubuntu-24.04","args":"--bundles appimage,deb,rpm","rust_targets":""},
            {"label":"linux-aarch64","platform":"ubuntu-24.04-arm","args":"--bundles appimage,deb,rpm","rust_targets":""}
          ]'
          labels=$(printf '%s\n' "${selected[@]}" | jq -R . | jq -sc .)
          matrix=$(jq -c --argjson want "$labels" \
            '{include: [.[] | select(.label as $l | $want | index($l))]}' <<<"$all")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq . <<<"$matrix"

  build:
    name: Build (${{ matrix.label }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.label }}

      - name: Install Linux webkit / bundler deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf \
            libfuse2t64 \
            xdg-utils
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          echo "TMPDIR=${{ github.workspace }}/target/tmp" >> "$GITHUB_ENV"
          mkdir -p "${{ github.workspace }}/target/tmp"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # The app config turns on updater artifacts, which need the release signing key. A test
      # build has no key, so switch them off for this run only. A file (not inline JSON) because
      # quoting inline JSON differs between the Windows and Linux shells.
      - name: Disable updater artifacts
        shell: bash
        run: echo '{"bundle":{"createUpdaterArtifacts":false}}' > apps/desktop/test-build.conf.json

      - name: Build installers
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }} --config test-build.conf.json

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: spiral-${{ matrix.label }}
          path: |
            target/**/bundle/dmg/*.dmg
            target/**/bundle/nsis/*.exe
            target/**/bundle/appimage/*.AppImage
            target/**/bundle/deb/*.deb
            target/**/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14
