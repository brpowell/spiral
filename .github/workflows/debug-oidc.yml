# TEMPORARY: prints the decoded GitHub OIDC claims (never the token) so we can
# compare them with the Anthropic federation rule. Remove once the release
# notes summary authenticates.
name: Debug OIDC
on:
  workflow_dispatch:
permissions:
  id-token: write
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print OIDC claims (not the token)
        run: |
          jwt=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value)
          echo "$jwt" | cut -d. -f2 | tr '_-' '/+' | awk '{ while (length($0)%4) $0=$0"="; print }' | base64 -d | jq 'del(.jti)'
