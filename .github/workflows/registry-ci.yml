name: Registry CI

on:
  pull_request:
    paths: &paths
      - "apps/registry/**"
      - "libs/spk-format/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Separate cache from the desktop job (both jobs are named "test"): the
      # desktop runner installs system liblzma, so its cached lzma-sys build
      # output fails to link on this runner.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: registry
      # The admin panel bundle is embedded at compile time and is not committed.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/registry/admin/package-lock.json
      - name: Build admin panel
        working-directory: apps/registry/admin
        run: |
          npm ci
          npm run build
      - run: cargo fmt -p spk-registry -p spk-format -- --check
      - run: cargo clippy -p spk-registry -p spk-format --all-targets -- -D warnings
      - run: cargo test -p spk-registry -p spk-format

  # The Postgres and S3 backends against real servers: Postgres directly and through PgBouncer
  # in transaction mode (what a serverless provider's pooled URL looks like), and MinIO as an
  # S3-compatible store. These tests skip themselves when their TEST_* variables are unset, so
  # the `test` job above stays dependency-free.
  backends:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: spk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DIRECT_URL: postgres://postgres:pw@127.0.0.1:5432/spk
      POOLED_URL: postgres://postgres:pw@127.0.0.1:6432/spk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: registry
      # The admin panel bundle is embedded at compile time and is not committed.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/registry/admin/package-lock.json
      - name: Build admin panel
        working-directory: apps/registry/admin
        run: |
          npm ci
          npm run build
      - name: Start PgBouncer (transaction pooling) and MinIO
        run: |
          docker run -d --name pgbouncer --network host \
            -e DB_HOST=127.0.0.1 -e DB_PORT=5432 -e DB_USER=postgres -e DB_PASSWORD=pw \
            -e DB_NAME=spk -e LISTEN_PORT=6432 -e POOL_MODE=transaction \
            -e AUTH_TYPE=scram-sha-256 -e ADMIN_USERS=postgres \
            edoburu/pgbouncer
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1 && break
            sleep 1
          done
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/6432) >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Postgres, direct
        run: TEST_DATABASE_URL="$DIRECT_URL" cargo test -p spk-registry --test backends --test migrations
      - name: Postgres, through PgBouncer
        run: |
          TEST_DATABASE_URL="$POOLED_URL" TEST_DATABASE_MIGRATE_URL="$DIRECT_URL" \
            TEST_DATABASE_POOLED=1 cargo test -p spk-registry --test backends
      - name: S3 (MinIO)
        run: |
          AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin \
            TEST_S3_ENDPOINT=http://127.0.0.1:9000 cargo test -p spk-registry --test s3
      - name: Container logs
        if: failure()
        run: |
          docker logs pgbouncer || true
          docker logs minio || true

  # Builds the production image from the repository root, then checks that it
  # boots, serves, runs unprivileged, keeps its data on /data, and stops cleanly
  # on SIGTERM. Catches Dockerfile breakage that cargo test cannot.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f apps/registry/Dockerfile -t spk-registry:ci .
      - name: Smoke test
        run: |
          set -eu
          docker run -d --name registry -p 8080:8080 \
            -e ADMIN_TOKEN="$(openssl rand -base64 32)" \
            -v registry-data:/data spk-registry:ci

          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/v1/meta >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/v1/meta | tee /dev/stderr | grep -q protocolVersion

          echo "--- runs as an unprivileged user"
          uid="$(docker exec registry sh -c "awk '/^Uid:/ {print \$2}' /proc/1/status")"
          echo "uid=$uid"
          test "$uid" != "0"

          echo "--- keeps its catalog on the /data volume"
          docker exec registry test -f /data/registry.db

          echo "--- stops cleanly on SIGTERM"
          docker stop registry >/dev/null
          code="$(docker inspect -f '{{.State.ExitCode}}' registry)"
          echo "exit code=$code"
          test "$code" = "0"
      - name: Container logs
        if: failure()
        run: docker logs registry || true
