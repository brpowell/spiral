# Manual publish gate (#179).
#
# Flips a draft GitHub Release → published after the platform matrix has attached
# installers. This is the go-live moment for Direct-channel updates (the
# marketing-site /api/updates route will read published releases).
#
# Why workflow_dispatch (not an auto job after platforms-green)?
# Required reviewers / wait timers on GitHub Environments are unavailable on
# this private repo's current billing plan. A human must run this workflow
# explicitly — that is the approval gate. When the plan supports Environment
# protection rules, enable required reviewers on `production-release` and the
# same job can also be attached to release.yml with `needs: platforms-green`.
#
# Local equivalent: `npm run release:publish -- vX.Y.Z`
name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Draft release tag to publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-release

    steps:
      - name: Require draft has installers for every platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          meta="$(gh release view "$TAG" --json isDraft,assets,url)"
          echo "$meta" | jq .

          is_draft="$(echo "$meta" | jq -r '.isDraft')"
          if [ "$is_draft" != "true" ]; then
            echo "::error::$TAG is not a draft — refusing to re-publish."
            exit 1
          fi

          assets="$(echo "$meta" | jq -r '.assets[].name')"
          echo "Assets on $TAG:"
          echo "$assets"

          missing=0
          require() {
            local pattern="$1"
            local label="$2"
            if ! printf '%s\n' "$assets" | grep -E "$pattern" >/dev/null; then
              echo "::error::Missing $label (expected asset matching /$pattern/)"
              missing=1
            fi
          }

          require '_aarch64\.dmg$' 'macOS aarch64 DMG'
          require '_(x64|x86_64)\.dmg$' 'macOS x64 DMG'
          require '-setup\.exe$' 'Windows NSIS installer'

          if [ "$missing" -ne 0 ]; then
            echo "::error::Draft release is missing platform artifacts — not publishing."
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false
          url="$(gh release view "$TAG" --json url --jq '.url')"
          echo "Published $TAG — $url"
          echo "Direct-channel auto-update goes live for this version once the marketing-site update route serves published releases."
