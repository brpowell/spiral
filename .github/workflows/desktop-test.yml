name: Tests

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "libs/spk-format/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "!**/*.md"
      - "!apps/desktop/docs/**"
      - "!**/*.mdc"
      - "!.github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "libs/spk-format/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "!**/*.md"
      - "!apps/desktop/docs/**"
      - "!**/*.mdc"
      - "!.github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Default extraheader is github.token, which cannot clone other private repos.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: desktop-test

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev

      - name: Install npm dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Check Tauri JS and Rust versions are aligned
        working-directory: apps/desktop
        run: npm run tauri:versions:check

      - name: Check third-party license bundle is up to date
        working-directory: apps/desktop
        run: npm run notice:check

      - name: Lint
        working-directory: apps/desktop
        run: npm run lint

      - name: Run tests
        working-directory: apps/desktop
        run: npm test
