name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Open or update release PR
    runs-on: ubuntu-latest
    steps:
      # Uses GITHUB_TOKEN by default. Once a tag/draft-triggered build matrix
      # lands (#177), switch to a PAT secret so release events can trigger
      # downstream workflows (GITHUB_TOKEN-created events do not).
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
