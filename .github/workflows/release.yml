# Builds release installers for every platform (macOS + Windows) and attaches
# them to the draft GitHub Release — it never publishes anything itself.
#
# Trigger: the v* tag that release-please creates alongside its draft release.
# For that tag push to actually reach this workflow, release-please must be
# configured with RELEASE_PLEASE_TOKEN (a PAT) — tags created via the default
# GITHUB_TOKEN do not fire tag-push events.
#
# Signing: secrets live in the `production-release` environment. The updater
# key (#181) is already configured; Apple notarization (#182) and Windows
# Authenticode (#183) are still optional. Because `secrets` can't be read in
# `if:` conditions, the Apple step gates on `runner.os == 'macOS'` and only
# appends a secret to GITHUB_ENV when it's non-empty, so unset secrets leave
# APPLE_* undefined rather than empty. This distinction matters: tauri-bundler
# treats a *present-but-empty* APPLE_CERTIFICATE as "please import this cert"
# and fails with SecKeychainItemImport on our unsigned CI runners. Never set
# APPLE_* directly on the job's `env:` block for this reason.
#
# Fan-in: `platforms-green` is the single required check — it only goes green
# once every matrix cell has succeeded and the draft has installers *and*
# updater artifacts (macOS .app.tar.gz + .sig; Windows NSIS .sig) for all
# platforms. It intentionally still runs (rather than being skipped) when a
# build fails, since a skipped check can read as green to required-check
# gating and downstream `needs:`. Operators should treat this job as the
# signal for "ready to publish"; the actual publish step lives in a separate
# workflow (publish-release.yml) and this file never auto-undrafts a release.
# Updater artifacts come from bundle.createUpdaterArtifacts + TAURI_SIGNING_*.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing draft-release tag to attach artifacts to (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    environment: production-release
    strategy:
      # Finish every cell so operators see the full failure picture; the
      # platforms-green job still fails the workflow if any cell failed.
      fail-fast: false
      matrix:
        include:
          - label: macos-aarch64
            platform: macos-latest
            # `app` must be explicit: `--bundles dmg` alone builds then deletes
            # Spiral.app, so createUpdaterArtifacts never leaves .app.tar.gz/.sig
            # for tauri-action to upload (you get "Signature not found…").
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust_targets: aarch64-apple-darwin
          - label: macos-x86_64
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            rust_targets: x86_64-apple-darwin
          - label: windows-x64
            platform: windows-latest
            args: --bundles nsis
            rust_targets: ""

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    env:
      # Updater signing (#181) — Environment secret on production-release
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Windows Authenticode (#183) — imported below when present (empty is fine;
      # that step is gated). Apple secrets are exported only when non-empty.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.label }}

      - name: Install frontend dependencies
        run: npm ci

      # Optional until #182 fills Apple secrets. `secrets` is not allowed in
      # `if:`; gate on macOS only and append non-empty values to GITHUB_ENV so
      # missing secrets leave APPLE_* unset (unsigned DMG) instead of empty-
      # string → failed import. Do not put APPLE_* on the job env.
      - name: Export Apple signing env when configured
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          append() {
            local name="$1" value="$2"
            [ -n "$value" ] || return 0
            {
              echo "${name}<<EOF"
              printf '%s\n' "$value"
              echo "EOF"
            } >> "$GITHUB_ENV"
          }
          append APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
          append APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          append APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
          append APPLE_ID "$APPLE_ID"
          append APPLE_PASSWORD "$APPLE_PASSWORD"
          append APPLE_TEAM_ID "$APPLE_TEAM_ID"
          append APPLE_API_KEY "$APPLE_API_KEY"
          append APPLE_API_ISSUER "$APPLE_API_ISSUER"

      # Optional until #183 fills WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD.
      # Also requires certificateThumbprint (etc.) in tauri.conf.json when signing is flipped on.
      - name: Import Windows certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        run: |
          New-Item -ItemType directory -Path certificate
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item -Path certificate/tempCert.txt
          Import-PfxCertificate `
            -FilePath certificate/certificate.pfx `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)

      - name: Build and upload to draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Attach to the draft release release-please already created for this tag.
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          # Spiral serves manifests from spiralpowered.com, not GitHub latest.json.
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

  # Fan-in gate (#185). Runs even when `build` failed so the check is red (not
  # skipped — skipped can look green to required-check / downstream needs).
  # Operators should only run Publish Release after this job is green.
  platforms-green:
    name: All platforms green
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every matrix cell succeeded
        run: |
          result="${{ needs.build.result }}"
          echo "build.result=$result"
          if [ "$result" != "success" ]; then
            echo "::error::Platform matrix incomplete or failed (result=$result). Draft is not release-ready."
            exit 1
          fi
          echo "All platform builds succeeded."

      - name: Verify draft has installers and updater artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')"
          echo "Assets on $TAG:"
          echo "$assets"

          missing=0
          require() {
            local pattern="$1"
            local label="$2"
            if ! printf '%s\n' "$assets" | grep -E "$pattern" >/dev/null; then
              echo "::error::Missing $label (expected asset matching /$pattern/)"
              missing=1
            fi
          }

          # Installers (browser download)
          require '_aarch64\.dmg$' 'macOS aarch64 DMG'
          require '_(x64|x86_64)\.dmg$' 'macOS x64 DMG'
          require '-setup\.exe$' 'Windows NSIS installer'

          # Updater payloads (in-app auto-update). macOS uses .app.tar.gz;
          # Windows reuses NSIS (updaterJsonPreferNsis) and needs its .sig.
          require '_aarch64\.app\.tar\.gz$' 'macOS aarch64 updater bundle'
          require '_aarch64\.app\.tar\.gz\.sig$' 'macOS aarch64 updater signature'
          require '_(x64|x86_64)\.app\.tar\.gz$' 'macOS x64 updater bundle'
          require '_(x64|x86_64)\.app\.tar\.gz\.sig$' 'macOS x64 updater signature'
          require '-setup\.exe\.sig$' 'Windows NSIS updater signature'

          if [ "$missing" -ne 0 ]; then
            echo "::error::Draft release is missing one or more platform artifacts — not release-ready."
            exit 1
          fi
          echo "Draft has installers and updater artifacts for every platform."
