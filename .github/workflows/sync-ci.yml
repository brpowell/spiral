name: Sync CI

on:
  pull_request:
    paths: &paths
      - "libs/sync/**"
      - "libs/host-api/**"
      # The host_db tests run against a fixture of this schema. Desktop CI checks the fixture
      # still matches; this reruns the sync tests when the migrations change.
      - "apps/desktop/src-tauri/src/db_migrations.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/sync-ci.yml"
  push:
    branches: [main, feat/sync]
    paths: *paths

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sync
      - run: cargo fmt -p spiral-sync -p spiral-host-api -- --check
      - run: cargo clippy -p spiral-sync -p spiral-host-api --all-targets -- -D warnings
      - run: cargo clippy -p spiral-sync -p spiral-host-api --all-targets --all-features -- -D warnings
      - run: cargo test -p spiral-sync -p spiral-host-api
      - run: cargo test -p spiral-sync -p spiral-host-api --all-features
