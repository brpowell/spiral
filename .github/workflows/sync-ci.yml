name: Sync CI

on:
  pull_request:
    paths: &paths
      - "libs/sync/**"
      # Its test checks libs/sync/tests/fixtures/host_schema.sql against the migrations.
      - "apps/desktop/src-tauri/src/db_migrations.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/sync-ci.yml"
  push:
    branches: [main, feat/sync]
    paths: *paths

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sync
      - run: cargo fmt -p spiral-sync -- --check
      - run: cargo clippy -p spiral-sync --all-targets -- -D warnings
      - run: cargo clippy -p spiral-sync --all-targets --all-features -- -D warnings
      - run: cargo test -p spiral-sync
      - run: cargo test -p spiral-sync --all-features
