name: Tests

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.mdc"
      - "docs/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/*.mdc"
      - "docs/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Default extraheader is github.token, which cannot clone other private repos.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            unzip \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev

      # Private GitHub npm git deps: github.token cannot clone another repo.
      # npm lockfiles resolve github: specs to git+ssh://, so rewrite SSH too.
      # --add is required: the same url.*.insteadOf key otherwise overwrites.
      - name: Allow private GitHub npm dependencies
        shell: bash
        env:
          GH_REPO_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          authed="https://x-access-token:${GH_REPO_TOKEN}@github.com/"
          git config --global --add url."${authed}".insteadOf "https://github.com/"
          git config --global --add url."${authed}".insteadOf "ssh://git@github.com/"
          git config --global --add url."${authed}".insteadOf "git@github.com:"

      - name: Install npm dependencies
        run: npm ci

      # Private native-lame Releases need a PAT with contents: read.
      # github.token cannot read a different private repo.
      - name: Bootstrap native artifacts
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: npm run bootstrap -- --target x86_64-unknown-linux-gnu

      - name: Check NOTICE is up to date
        run: npm run notice:check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
