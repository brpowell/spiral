# Manual publish gate (#179).
#
# Flips a draft GitHub Release → published after the platform matrix has attached
# installers. This is the go-live moment for Direct-channel updates (the
# marketing-site /api/updates route will read published releases).
#
# Why workflow_dispatch (not an auto job after platforms-green)?
# Required reviewers / wait timers on GitHub Environments are unavailable on
# this private repo's current billing plan. A human must run this workflow
# explicitly — that is the approval gate. When the plan supports Environment
# protection rules, enable required reviewers on `production-release` and the
# same job can also be attached to release.yml with `needs: platforms-green`.
#
# Local equivalent: `npm run release -- publish desktop-vX.Y.Z`
name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Draft release tag to publish (e.g. desktop-v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-release

    steps:
      - uses: actions/checkout@v4

      - name: Require draft has installers and updater artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: apps/desktop
        run: node scripts/release/check-release-assets.mjs "${{ inputs.tag }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Refuse if someone published between the asset check and now.
          is_draft="$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft')"
          if [ "$is_draft" != "true" ]; then
            echo "::error::$TAG is not a draft — refusing to re-publish."
            exit 1
          fi
          gh release edit "$TAG" --repo "$REPO" --draft=false
          url="$(gh release view "$TAG" --repo "$REPO" --json url --jq '.url')"
          echo "Published $TAG — $url"
          echo "Direct-channel auto-update goes live for this version once the marketing-site update route serves published releases."
