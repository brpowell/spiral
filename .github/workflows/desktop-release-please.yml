name: Release PR

on:
  push:
    branches:
      - main
  # Escape hatch: re-run only the release-notes steps against an existing tag
  # (e.g. after fixing this workflow, or when the summary step failed). It never
  # runs release-please, so it cannot open a release PR or create a release,
  # and it does not touch the tag that triggers the release build.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rewrite notes for (e.g. desktop-v1.0.0)"
        required: true
        type: string
      force:
        description: "Regenerate the summary even if the release already has one"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write
  # GitHub OIDC token, exchanged for a short-lived Anthropic token (Workload
  # Identity Federation) when summarizing release notes.
  id-token: write

jobs:
  release-please:
    name: Open or update release PR
    runs-on: ubuntu-latest
    steps:
      # Prefer RELEASE_PLEASE_TOKEN (PAT with contents:write) so the tag/draft
      # this action creates can trigger `.github/workflows/release.yml`.
      # GITHUB_TOKEN-created tags/releases do not fire downstream workflows.
      # Until the PAT secret exists, falls back to GITHUB_TOKEN (matrix won't
      # auto-trigger — re-run Release via workflow_dispatch on the tag).
      - uses: googleapis/release-please-action@v4
        id: release
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The release notes steps below run for a release created by this run, or
      # for the tag given to a manual run. release-please is configured with the
      # `apps/desktop` path, so its outputs are prefixed with it: the bare
      # `release_created` / `tag_name` only exist for a root package and would
      # always be empty here.
      - name: Resolve release tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          CREATED: ${{ steps.release.outputs['apps/desktop--release_created'] }}
          CREATED_TAG: ${{ steps.release.outputs['apps/desktop--tag_name'] }}
        run: |
          if [ -n "$DISPATCH_TAG" ]; then
            echo "name=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          elif [ "$CREATED" = "true" ]; then
            echo "name=$CREATED_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
          fi

      # Draft body only — CHANGELOG.md stays the raw release-please record.
      - uses: actions/checkout@v4
        if: ${{ steps.tag.outputs.name != '' }}

      - name: Sanitize draft release notes
        if: ${{ steps.tag.outputs.name != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        working-directory: apps/desktop
        run: node scripts/release/sanitize-release-notes.mjs "$RELEASE_TAG"

      # Adds a draft user-facing summary above the line items (collapsed in a
      # <details>) for the release manager to review before publishing.
      # Best effort: on an auth or API error the sanitized notes stay as they
      # are and the release is not blocked.
      #
      # Auth is Workload Identity Federation: the job's GitHub OIDC token is
      # exchanged for a short-lived Anthropic token, so no API key is stored.
      # Set these repository variables (identifiers, not secrets):
      #   ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID,
      #   ANTHROPIC_SERVICE_ACCOUNT_ID, and ANTHROPIC_WORKSPACE_ID if the rule
      #   covers more than one workspace.
      # Optional: RELEASE_NOTES_MODEL overrides the default model.
      # Do not add ANTHROPIC_API_KEY here; a key would take precedence.
      # To turn summaries off, delete the ANTHROPIC_FEDERATION_RULE_ID variable:
      # this step is skipped and the sanitized notes are published as-is.
      - name: Summarize draft release notes
        if: ${{ steps.tag.outputs.name != '' && vars.ANTHROPIC_FEDERATION_RULE_ID != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
          FORCE_SUMMARY: ${{ inputs.force }}
        working-directory: apps/desktop
        run: |
          if [ "$FORCE_SUMMARY" = "true" ]; then
            node scripts/release/summarize-release-notes.mjs "$RELEASE_TAG" --force
          else
            node scripts/release/summarize-release-notes.mjs "$RELEASE_TAG"
          fi
