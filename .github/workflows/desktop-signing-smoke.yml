# Signs a throwaway exe with the same script and Azure setup the release
# build uses, in about a minute, so signing problems don't cost a full
# 12-minute release build to find.
# Run it by hand after changing the signing setup (Azure roles, secrets, the
# signing script): Actions > Signing smoke test > Run workflow.
name: Signing smoke test

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner to test on"
        required: false
        default: both
        type: choice
        options:
          - both
          - windows-latest
          - windows-11-arm

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    name: Sign a throwaway exe (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Pick one runner, or test both.
        runner: ${{ fromJSON(inputs.runner != 'both' && format('["{0}"]', inputs.runner) || '["windows-latest","windows-11-arm"]') }}
    environment: production-release
    timeout-minutes: 15
    env:
      AZURE_SIGNING_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SIGNING_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Windows PowerShell (not pwsh) for Add-Type's compiler.
      - name: Build an unsigned exe
        shell: powershell
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'smoke.exe'
          Add-Type -TypeDefinition 'public class P { public static void Main() {} }' -OutputAssembly $exe -OutputType ConsoleApplication
          "SMOKE_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGN_LOG_PATH=$(Join-Path $env:RUNNER_TEMP 'sign-windows.log')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Get-AuthenticodeSignature $exe).Status

      - name: Sign
        run: node apps/desktop/scripts/release/sign-windows.mjs "$env:SMOKE_EXE"
        shell: pwsh

      - name: Show signing log
        if: always()
        shell: pwsh
        run: |
          if (Test-Path $env:SIGN_LOG_PATH) { Get-Content $env:SIGN_LOG_PATH }
          else { Write-Host 'No signing log: the script never wrote one.' }

      - name: Check the signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature $env:SMOKE_EXE
          Write-Host "Status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          Write-Host "Timestamp: $($sig.TimeStamperCertificate.Subject)"
          if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) { exit 1 }
