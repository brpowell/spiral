[package]
name = "spk-format"
version = "0.1.0"
edition = "2021"
description = "Spiral pack (.spk) manifest schema, validation, and archive helpers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/spiral-powered/spk-format"
readme = "README.md"
keywords = ["spiral", "pack", "spk"]
categories = ["encoding"]
exclude = [".git*", "target"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
zip = "2"

[lib]
name = "spk_format"
path = "src/lib.rs"
